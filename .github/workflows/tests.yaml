name: tests

# Offline smoke tests: no AWS credentials, no model calls.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: assistant/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
