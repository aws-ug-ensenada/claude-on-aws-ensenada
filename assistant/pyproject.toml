# Level 8: what the AgentCore CLI packages for AgentCore Runtime (agentcore dev / build / deploy).
# On your laptop, requirements.txt is enough. Keep the shared pins here and there in step.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luna"
version = "0.1.0"
description = "Luna personal assistant (AWS User Group Ensenada)"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[a2a,anthropic]==1.63.0",
    "bedrock-agentcore==1.25.2",
    "PyYAML==6.0.3",
    "aws-opentelemetry-distro~=0.21.0",   # AgentCore starts the code with opentelemetry-instrument
    "mcp-proxy-for-aws==1.0.0",           # SigV4 for the AgentCore Gateway (level 8)
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.agentcore]
entrypoint = "app.py"
